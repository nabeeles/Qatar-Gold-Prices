name: Scrape Gold Prices

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Setup Regional Egress Proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor tor-geoipdb
          sudo systemctl stop tor tor@default 2>/dev/null || true
          sudo tee -a /etc/tor/torrc > /dev/null << 'EOF'
          ExitNodes {se},{ch},{nl},{fi},{no},{gb},{fr},{it},{pl},{cz},{ro},{de},{in},{id},{sg}
          StrictNodes 1
          MaxCircuitDirtiness 10
          NewCircuitPeriod 5
          Log notice file /tmp/tor.log
          EOF
          sudo touch /tmp/tor.log
          sudo chown debian-tor:debian-tor /tmp/tor.log
          sudo -u debian-tor tor --RunAsDaemon 1
          for i in $(seq 1 30); do
            if grep -q "Bootstrapped 100%" /tmp/tor.log 2>/dev/null; then
              echo "Tor regional egress ready in ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Scraper
        env:
          CI: 'true'
          ALFARDAN_SOCKS_PROXY: '127.0.0.1:9050'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          cd backend/scraper
          node index.js
