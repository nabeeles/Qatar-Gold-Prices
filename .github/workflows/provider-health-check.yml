name: Provider Health Check

on:
  schedule:
    - cron: '0 8 * * *' # Run every day at 8:00 AM UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Setup Regional Egress Proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo systemctl stop tor tor@default 2>/dev/null || true
          sudo mkdir -p /var/log/tor
          sudo chown debian-tor:adm /var/log/tor
          sudo truncate -s 0 /var/log/tor/notices.log
          sudo chown debian-tor:adm /var/log/tor/notices.log
          sudo tee -a /etc/tor/torrc > /dev/null << 'EOF'
          Log notice file /var/log/tor/notices.log
          ExcludeExitNodes {us}
          EOF
          sudo -u debian-tor -H tor --RunAsDaemon 1
          for i in $(seq 1 30); do
            if sudo grep -q "Bootstrapped 100%" /var/log/tor/notices.log 2>/dev/null; then
              echo "Tor regional egress ready in ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Health Check
        env:
          CI: 'true'
          ALFARDAN_SOCKS_PROXY: '127.0.0.1:9050'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          cd backend/scraper
          node health-check.js
